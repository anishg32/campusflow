<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>No Internet Connection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            color: #334155;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            color: #94a3b8;
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
        }
        p {
            margin: 0 0 32px 0;
            font-size: 15px;
            max-width: 80%;
            line-height: 1.5;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 99px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }
        button:active {
            transform: scale(0.96);
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18m-3.207-3.207A10.01 10.01 0 0112 22a10.01 10.01 0 01-7.071-2.929m14.142 0A10.01 10.01 0 0022 12c0-2.6-1.002-4.966-2.645-6.757M4.929 4.929A10.01 10.01 0 002 12a10.01 10.01 0 002.929 7.071m14.142 0c.934-.933 1.708-2.022 2.274-3.207M12 2C6.477 2 2 6.477 2 12c0 1.25.234 2.443.655 3.535M12 2c5.523 2 10 6.477 10 12 0 1.25-.234 2.443-.655 3.535"></path>
    </svg>
    <h1>No Connection</h1>
    <p>Please check your internet connection and try again.</p>
    <button onclick="window.location.href = 'https://production-url-here.com'">Retry</button>
</body>
</html>
